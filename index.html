<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="由小红书：良哥看未来整理，更新时间：2026 年 10 月 3 日">
  <title>良友频道库 · 良哥看未来</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#channels">跳到频道</a>
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="良友频道库首页"><span class="brand-mark" aria-hidden="true">良</span><span>良友频道库</span></a>
    <a class="json-link" href="./liangyouchannels.json" download>下载 JSON <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg></a>
  </header>
  <main>
    <div class="intro">
      <div><p class="eyebrow">LIANGYOU CHANNELS</p><h1>找到主播，点一下就复制。</h1><p class="instruction">复制后，在汇流选择对应平台，粘贴到手动添加的输入框。</p></div>
      <div class="total"><strong id="total-count">78</strong><span>个频道 / 5 个平台</span></div>
    </div>
    <nav class="platform-nav" aria-label="跳到平台">
      <a href="#douyin"><span class="platform-dot douyin"></span>抖音 <span data-count="douyin">30</span></a>
      <a href="#douyu"><span class="platform-dot douyu"></span>斗鱼 <span data-count="douyu">12</span></a>
      <a href="#huya"><span class="platform-dot huya"></span>虎牙 <span data-count="huya">12</span></a>
      <a href="#bilibili"><span class="platform-dot bilibili"></span>B站 <span data-count="bilibili">15</span></a>
      <a href="#yy"><span class="platform-dot yy"></span>YY <span data-count="yy">9</span></a>
    </nav>
    <div id="channels" aria-busy="true"><p class="loading">正在读取频道…</p></div>
    <noscript><p class="error-message">请启用 JavaScript 以使用点击复制功能。也可以下载 JSON 查看完整房间号。</p></noscript>
  </main>
  <footer><span id="collection-description">由小红书：良哥看未来整理，更新时间：2026 年 10 月 3 日</span><a href="https://github.com/MaddestAlistar/LiangyouChannels" target="_blank" rel="noopener noreferrer">GitHub 仓库</a></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="manual-copy" aria-labelledby="manual-copy-title">
    <h2 id="manual-copy-title">复制房间号</h2>
    <p>浏览器暂时不能自动复制，长按下方内容即可复制。</p>
    <input id="manual-copy-value" type="text" readonly aria-label="完整房间号">
    <form method="dialog"><button type="submit">完成</button></form>
  </dialog>
</body>
</html>
